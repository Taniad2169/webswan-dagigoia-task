<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WebSwan Voice Studio</title>
<link rel="icon" href="../rachel-bot/ws-logo.png">
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17324c;background:#f3f8fc;--blue:#168fc4;--line:#e1ebf2}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:9}.skip:focus{left:8px}
aside{position:fixed;width:240px;background:#fff;height:100vh;padding:28px 18px;border-right:1px solid var(--line);overflow:auto}
.brand{font-weight:800;font-size:21px;letter-spacing:-.5px;color:#17648b}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#63a3bd;margin:4px 0 38px}
.nav{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;color:#587187;margin:3px 0}
.nav.active{background:#e4f5fd;color:#087eae;font-weight:700}.nav:hover{background:#f1f8fc}
.asidefoot{margin-top:40px;color:#7490a0;font-size:12px}
main{margin-left:240px;padding:36px 5%;max-width:1600px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:30px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 14px}h3{margin:0 0 6px;font-size:16px}
p,.muted{color:#5f7a8c;line-height:1.55}
.pill{font-size:12px;padding:7px 12px;border-radius:50px;background:#fff2dc;color:#8a5a14;white-space:nowrap}
.pill.ok{background:#e3f7ec;color:#0b6b3a}.pill.bad{background:#fde8e8;color:#9b2323}.pill.info{background:#eaf5fa;color:#137a9f}
.banner{margin:28px 0;background:linear-gradient(110deg,#075478,#168cb8);color:#fff;border-radius:18px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:25px}
.banner p{color:#d7f2fb;max-width:640px;margin-bottom:0}.banner h2{font-size:24px;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 4px 16px #0d42620a}
.stat strong{display:block;font-size:28px;margin:12px 0 4px;color:#124260}.stat span{color:#6a8494;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section{margin-top:24px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:10px 16px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.06)}.btn.small{padding:6px 10px;font-size:13px}
.secondary{background:#eaf5fa;color:#126f92}.outline{background:#fff;color:#2f6a86;border:1px solid #cfe0ea}.danger{background:#fff;color:#a12c2c;border:1px solid #f0c9c9}.green{background:#12a05c}
.btn[disabled]{opacity:.5;cursor:default}
.empty{text-align:center;padding:34px 12px;color:#6f8797}
.chip{display:inline-block;background:#eaf6fb;color:#1f6f90;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:600}
.chip.warn{background:#fff2dc;color:#8a5a14}.chip.bad{background:#fde8e8;color:#9b2323}.chip.ok{background:#e3f7ec;color:#0b6b3a}
.listitem{padding:14px 0;border-bottom:1px solid #edf2f5}.listitem:last-child{border:0}.listitem strong{display:block}.listitem small{color:#6f8797}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf2f5;vertical-align:top}th{color:#6f8797;font-size:12px;letter-spacing:.04em}
td .btn{margin:0 4px 4px 0}
input,select,textarea{width:100%;border:1px solid #cfe0ea;padding:10px 11px;border-radius:8px;color:#17324c;background:#fff}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
.hint{font-size:12px;color:#6f8797;margin-top:4px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
dialog{border:0;border-radius:16px;padding:26px;width:min(640px,94vw);max-height:92vh;box-shadow:0 15px 80px #1239}
dialog::backdrop{background:#12334d88}
.note{font-size:13px;background:#eff8fc;border-radius:10px;padding:14px;color:#456a7d;line-height:1.5}
.note.warn{background:#fff7e8;color:#7a5313}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.tablewrap{overflow:auto;position:relative}
a{color:#137fae}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12334d;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px #0004;z-index:50;display:none;max-width:90vw}
.agentcard h2{margin:12px 0 4px}
.script{white-space:pre-wrap;background:#f7fbfd;border:1px solid #e1eef4;border-radius:10px;padding:12px;font-size:14px;max-height:160px;overflow:auto}
/* practice call */
.callbox{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.line{padding:10px 12px;border-radius:12px;margin:6px 0;font-size:14px;line-height:1.5}
.line.agent{background:#eaf5fa;border:1px solid #d3e8f2}.line.prospect{background:#fff;border:1px solid #e1ebf2;margin-left:40px}
.line.now{outline:3px solid #48d6fa}
.callog{max-height:46vh;overflow:auto;padding-right:4px}
.mic{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3898f5,#48d6fa);color:#fff;font-size:28px;margin:0 auto 10px}
.speaking .mic{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px #48d6fa33}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.callbox{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
@media(max-width:800px){aside{position:static;width:auto;height:auto;padding:16px}.brand small{margin-bottom:10px}.nav{display:inline-block;width:auto;padding:9px}.asidefoot{display:none}main{margin:0;padding:24px 16px}.two{grid-template-columns:1fr}.banner{display:block}.banner .btn{margin-top:14px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<aside><div class="brand">🦢 WebSwan<small>VOICE STUDIO</small></div><nav id="nav" aria-label="Sections"></nav><div class="asidefoot">YOUR PRIVATE WORKSPACE<br>Where your business takes flight.</div></aside>
<main>
  <header><div><div class="muted" style="font-size:13px">WEBSWAN VOICE STUDIO / <span id="crumb">OVERVIEW</span></div><h1 id="title">Overview</h1></div><div class="toolbar"><span class="pill">● Calling service not connected · practice mode</span><a class="btn outline small" href="https://play.cartesia.ai/agents" target="_blank" rel="noopener noreferrer" title="Cartesia: your AI voice agents (Rebecca, George), phone numbers, API keys and usage">🎧 Cartesia Agents</a><button type="button" id="cloudBtn" class="btn outline small" onclick="window.cloudClick && window.cloudClick()" title="Sync your workspace to your private WebSwan cloud">☁ Sign in to sync</button></div></header>
  <div id="content" tabindex="-1"></div>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle"></h2><button class="nav" style="width:auto" type="button" onclick="closeModal()" aria-label="Close">✕</button></div><form id="form"></form></dialog>
<input type="file" id="csv" accept=".csv,text/csv" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   WebSwan Voice Studio — leads, AI agents, campaigns, practice calls.
   Everything is saved in this browser (localStorage). No calls are placed
   until a phone + AI voice provider is connected.
   ========================================================= */
const KEY = 'webswan_voice_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
state = state || {};
state.leads = state.leads || []; state.agents = state.agents || []; state.campaigns = state.campaigns || []; state.calls = state.calls || [];
// give older records ids
['leads', 'agents', 'campaigns', 'calls'].forEach(k => state[k].forEach(x => { if (!x.id) x.id = uid(); }));
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Could not save: browser storage is full or blocked.'); } }
save();

let page = 'Overview';
const pages = ['Overview', 'SDR AI', 'Leads', 'Agents', 'Campaigns', 'Practice call', 'Call records', 'Usage & setup'];
const icons = ['◫', '✦', '♙', '◉', '◷', '🎙', '☎', '⚙'];
const STATUSES = ['New', 'Contacted', 'Interested', 'Appointment requested', 'Follow up', 'Not interested', 'Do not call'];
const LINE_TYPES = ['Business landline', 'Mobile', 'Unknown'];
const CONSENTS = ['None', 'Oral consent', 'Prior express written consent'];
const OUTCOMES = ['No answer', 'Left voicemail', 'Spoke: interested', 'Spoke: not interested', 'Appointment requested', 'Call back later', 'Wrong number', 'Asked not to be called'];

/* ---------- helpers ---------- */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, 3200); }
function closeModal() { stopSpeech(); $('modal').close(); }
function byId(list, id) { return state[list].find(x => x.id === id); }
function fmtDate(ts) { try { return new Date(ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ts; } }
function digits(p) { return String(p || '').replace(/[^\d+]/g, ''); }
function greetName(lead) {
  const parts = String((lead && lead.name) || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return 'there';
  if (/^(dr\.?|doctor)$/i.test(parts[0])) return parts.length > 1 ? 'Dr. ' + parts[parts.length - 1] : 'Doctor';
  if (/^(mr|mrs|ms|miss|atty|attorney)\.?$/i.test(parts[0]) && parts.length > 1) return parts[0].replace(/\.?$/, '.').replace(/^atty\.|^attorney\./i, 'Attorney') + ' ' + parts[parts.length - 1];
  return parts[0];
}
function fill(text, lead, agent) {
  return String(text || '')
    .replace(/\{name\}/gi, greetName(lead))
    .replace(/\{fullname\}/gi, (lead && lead.name) || '')
    .replace(/\{business\}/gi, (lead && lead.business) || 'your business')
    .replace(/\{agent\}/gi, (agent && agent.name) || 'your WebSwan assistant');
}

/* ---------- calling hours (8 AM to 9 PM in the lead's time zone) ---------- */
const TZ = { AL: 'America/Chicago', AK: 'America/Anchorage', AZ: 'America/Phoenix', AR: 'America/Chicago', CA: 'America/Los_Angeles', CO: 'America/Denver', CT: 'America/New_York', DE: 'America/New_York', DC: 'America/New_York', FL: 'America/New_York', GA: 'America/New_York', HI: 'Pacific/Honolulu', ID: 'America/Boise', IL: 'America/Chicago', IN: 'America/Indiana/Indianapolis', IA: 'America/Chicago', KS: 'America/Chicago', KY: 'America/New_York', LA: 'America/Chicago', ME: 'America/New_York', MD: 'America/New_York', MA: 'America/New_York', MI: 'America/Detroit', MN: 'America/Chicago', MS: 'America/Chicago', MO: 'America/Chicago', MT: 'America/Denver', NE: 'America/Chicago', NV: 'America/Los_Angeles', NH: 'America/New_York', NJ: 'America/New_York', NM: 'America/Denver', NY: 'America/New_York', NC: 'America/New_York', ND: 'America/Chicago', OH: 'America/New_York', OK: 'America/Chicago', OR: 'America/Los_Angeles', PA: 'America/New_York', RI: 'America/New_York', SC: 'America/New_York', SD: 'America/Chicago', TN: 'America/Chicago', TX: 'America/Chicago', UT: 'America/Denver', VT: 'America/New_York', VA: 'America/New_York', WA: 'America/Los_Angeles', WV: 'America/New_York', WI: 'America/Chicago', WY: 'America/Denver', PR: 'America/Puerto_Rico' };
// stricter state windows: [startHour, endHour)
const STATE_HOURS = { CT: [9, 20], FL: [8, 20], OK: [8, 20], MD: [8, 20], WA: [8, 20], TX: [9, 21] };
function stateCode(s) { s = String(s || '').trim().toUpperCase(); return s.length === 2 ? s : ''; }
function localInfo(lead) {
  const st = stateCode(lead.state); const tz = TZ[st];
  if (!tz) return { known: false, label: 'Add state', ok: null };
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', weekday: 'short', hour12: true }).formatToParts(new Date());
  const get = t => (parts.find(p => p.type === t) || {}).value;
  const h24 = Number(new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
  const win = STATE_HOURS[st] || [8, 21];
  const ok = h24 >= win[0] && h24 < win[1];
  return { known: true, ok, label: `${get('weekday')} ${get('hour')}:${get('minute')} ${get('dayPeriod')} (${st})`, window: win };
}
/* ---------- AI calling eligibility (not legal advice) ---------- */
function eligibility(lead) {
  if (lead.status === 'Do not call') return { ok: false, why: 'Do not call' };
  if (!digits(lead.phone)) return { ok: false, why: 'No phone' };
  if (lead.lineType === 'Business landline') return { ok: true, why: 'Business landline' };
  if (lead.consent === 'Prior express written consent') return { ok: true, why: 'Written consent' };
  if (lead.lineType === 'Mobile') return { ok: false, why: 'Mobile: needs written consent' };
  return { ok: false, why: 'Confirm line type' };
}

/* ---------- browser voices (free preview only) ---------- */
const synth = window.speechSynthesis; const canSpeak = !!(synth && window.SpeechSynthesisUtterance);
function voices() { return canSpeak ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : []; }
if (canSpeak && synth.addEventListener) synth.addEventListener('voiceschanged', () => { if ($('f_previewVoice')) fillVoiceSelect($('f_previewVoice').dataset.cur); });
function fillVoiceSelect(cur) {
  const sel = $('f_previewVoice'); if (!sel) return;
  const vs = voices();
  sel.innerHTML = '<option value="">Default browser voice</option>' + vs.map(v => `<option ${v.name === cur ? 'selected' : ''}>${esc(v.name)}</option>`).join('');
}
function speak(text, agent, onend) {
  if (!canSpeak) { toast('This browser cannot play voices.'); if (onend) onend(); return; }
  stopSpeech();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\bAI\b/g, 'A I').replace(/\bWSMN\b/g, 'W S M N').replace(/\bWSBPA\b/g, 'W S B P A').replace(/\bADA\b/g, 'A D A'));
  const v = voices().find(x => x.name === (agent && agent.previewVoice));
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = Number(agent && agent.rate) || 1; u.pitch = Number(agent && agent.pitch) || 1;
  document.body.classList.add('speaking');
  u.onend = u.onerror = () => { document.body.classList.remove('speaking'); if (onend) onend(); };
  synth.speak(u);
}
function stopSpeech() { if (canSpeak) synth.cancel(); document.body.classList.remove('speaking'); }

/* ---------- render ---------- */
function nav(p) { stopSpeech(); if (p === 'SDR AI' && state.sdr) state.sdr.lead = ''; page = p; render(); $('content').focus({ preventScroll: true }); window.scrollTo(0, 0); }
function render() {
  $('nav').innerHTML = pages.map((p, i) => `<button class="nav ${page === p ? 'active' : ''}" type="button" ${page === p ? 'aria-current="page"' : ''} onclick="nav('${p}')">${icons[i]} &nbsp; ${p}</button>`).join('');
  $('title').textContent = page; $('crumb').textContent = page.toUpperCase();
  const c = $('content');
  ({ 'Overview': renderOverview, 'SDR AI': renderSDR, 'Leads': renderLeads, 'Agents': renderAgents, 'Campaigns': renderCampaigns, 'Practice call': renderPractice, 'Call records': renderCalls, 'Usage & setup': renderSetup }[page])(c);
}

function renderOverview(c) {
  const eligible = state.leads.filter(l => eligibility(l).ok).length;
  const callableNow = state.leads.filter(l => eligibility(l).ok && localInfo(l).ok).length;
  const appts = state.calls.filter(x => x.outcome === 'Appointment requested').length;
  c.innerHTML = `<div class="banner"><div><h2>Welcome to your voice studio, Tania.</h2><p>Bring your leads, agents and campaigns together, then rehearse every call with your AI team before the phone service goes live.</p></div><button class="btn" onclick="nav('Practice call')">Start a practice call →</button></div>
  <div class="grid">
    <div class="card stat"><span>YOUR LEADS</span><strong>${state.leads.length}</strong><span>${eligible} eligible for AI calls</span></div>
    <div class="card stat"><span>YOUR AGENTS</span><strong>${state.agents.length}</strong><span>Agent profiles</span></div>
    <div class="card stat"><span>CAMPAIGNS</span><strong>${state.campaigns.length}</strong><span>Draft campaigns</span></div>
    <div class="card stat"><span>CALLS LOGGED</span><strong>${state.calls.length}</strong><span>${appts} appointment request${appts === 1 ? '' : 's'}</span></div>
  </div>
  <div class="two section"><div class="card"><div class="row"><h2>Get started</h2><span class="chip">Your workspace</span></div>
    <div class="listitem row"><div><strong>1. Bring in your leads</strong><small>Add them, or import a CSV from Google Sheets. Set each lead’s state and line type.</small></div><button class="btn secondary small" onclick="nav('Leads')">Leads</button></div>
    <div class="listitem row"><div><strong>2. Create your agents</strong><small>Rebecca and Alek (Media Network), Monica (doctors) and George (attorneys): scripts, opening line and a voice to preview.</small></div><button class="btn secondary small" onclick="nav('Agents')">Agents</button></div>
    <div class="listitem row"><div><strong>3. Prepare a campaign</strong><small>Pick an agent and the leads to call. Ineligible leads are skipped automatically.</small></div><button class="btn secondary small" onclick="nav('Campaigns')">Campaigns</button></div>
    <div class="listitem row"><div><strong>4. Practice the call</strong><small>Hear your agent read the script to a lead, then log the result.</small></div><button class="btn secondary small" onclick="nav('Practice call')">Practice</button></div>
  </div>
  <div class="card"><h2>Right now</h2><p><b>${callableNow}</b> eligible lead${callableNow === 1 ? ' is' : 's are'} inside calling hours in their own time zone.</p><p>Live AI calls, recordings and transcripts start once a phone and AI voice service are connected.</p><button class="btn secondary" onclick="nav('Usage & setup')">See setup status</button><p style="margin-top:18px"><b>✦ SDR AI:</b> ${sdrQueue().filter(x => x.kind !== 'start').length} outreach action(s) due today, ${sdrReadyList().length} lead(s) ready for you.</p><button class="btn" onclick="nav('SDR AI')">Open SDR AI →</button></div></div>`;
}

/* ---------- leads ---------- */
function renderLeads(c) {
  c.innerHTML = `<div class="row section"><p>Manage your prospects in one place.</p><div class="toolbar"><button class="btn outline" onclick="$('csv').click()">Import CSV</button><button class="btn secondary" onclick="exportLeads()">Export CSV</button><button class="btn" onclick="leadForm()">+ Add lead</button></div></div>
  <div class="note">From Google Sheets: <b>File → Download → Comma-separated values (.csv)</b>, then import it here. Columns recognized: name, business, phone, email, state, line type, consent, status, notes. Data is saved in this browser only, so export a backup now and then.</div>
  <div class="card section"><div class="filters"><div><label for="search" style="margin-top:0">Search</label><input id="search" placeholder="Search name, business, phone or email" oninput="leadsTable()"></div>
  <div><label for="fStatus" style="margin-top:0">Status</label><select id="fStatus" onchange="leadsTable()"><option value="">All statuses</option>${STATUSES.map(s => `<option>${s}</option>`).join('')}</select></div>
  <div><label for="fElig" style="margin-top:0">AI calling</label><select id="fElig" onchange="leadsTable()"><option value="">All leads</option><option value="yes">Eligible only</option><option value="no">Not eligible</option></select></div></div>
  <div id="leadTable"></div></div>`;
  leadsTable();
}
function leadsTable() {
  const q = ($('search').value || '').toLowerCase(), fs = $('fStatus').value, fe = $('fElig').value;
  const rows = state.leads.filter(x => [x.name, x.business, x.phone, x.email, x.state, x.notes].join(' ').toLowerCase().includes(q))
    .filter(x => !fs || (x.status || 'New') === fs)
    .filter(x => !fe || (eligibility(x).ok === (fe === 'yes')));
  $('leadTable').innerHTML = rows.length ? `<div class="row" style="margin-top:14px"><span class="muted">${rows.length} of ${state.leads.length} leads</span></div><div class="tablewrap"><table><thead><tr><th>NAME</th><th>BUSINESS</th><th>PHONE</th><th>LOCAL TIME</th><th>AI CALLING</th><th>STATUS</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows.map(x => {
    const e = eligibility(x), t = localInfo(x);
    return `<tr><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.email)}</small><br>${tierChip(sdrScore(x))}</td><td>${esc(x.business)}</td><td>${x.phone ? `<a href="tel:${esc(digits(x.phone))}">${esc(x.phone)}</a>` : '—'}<br><small class="muted">${esc(x.lineType || 'Unknown')}</small></td>
    <td>${t.known ? `<span class="chip ${t.ok ? 'ok' : 'warn'}">${t.ok ? 'OK now' : 'Outside hours'}</span><br><small class="muted">${esc(t.label)}</small>` : '<span class="chip warn">Add state</span>'}</td>
    <td><span class="chip ${e.ok ? 'ok' : 'bad'}">${e.ok ? 'Eligible' : 'Not eligible'}</span><br><small class="muted">${esc(e.why)}</small></td>
    <td>${esc(x.status || 'New')}</td>
    <td style="white-space:nowrap"><button class="btn small" onclick="sdrOpen('${x.id}')" title="SDR AI brief: score, best offer, memory">✦ Brief</button><button class="btn green small" onclick="liveCall('${x.id}')" ${e.ok && !(state.sdr && state.sdr.paused) ? '' : 'disabled'} title="${e.ok ? 'Live AI call through Cartesia' : 'Not eligible: ' + esc(e.why)}">📞 Call</button><button class="btn secondary small" onclick="practiceWith('${x.id}')" title="Practice a call with this lead">🎙 Practice</button><button class="btn outline small" onclick="logCall('${x.id}')" title="Log a call you made">☎ Log</button><button class="btn outline small" onclick="leadForm('${x.id}')">Edit</button><button class="btn danger small" onclick="delItem('leads','${x.id}')" aria-label="Delete ${esc(x.name)}">🗑</button></td></tr>`;
  }).join('')}</tbody></table></div>` : '<div class="empty">No leads to display. Add one or import a CSV file.</div>';
}

/* ---------- forms ---------- */

}

/* ---------- SDR AI brain (Gemini via Firebase AI Logic) ---------- */
function brainOn() { return !!(window.aiBrain && window.aiBrain.ready); }
function leadForAI(l) { return l && l.id ? { name: l.name, business: l.business, industry: guessIndustry(l), state: l.state, status: l.status, research: R(l), memories: M(l).map(m => m.cat + ': ' + m.text) } : { name: 'Sample lead', business: '' }; }
function agentForAI(a, fallbackName) { a = a || {}; return { name: a.name || fallbackName || 'Agent', role: a.role || '', opening: a.opening || '', script: a.script || '' }; }
async function aiReviewCall(callId, silent) {
  const c = byId('calls', callId); if (!c) return;
  if (!brainOn()) { if (!silent) toast('The AI brain is still loading. Try again in a moment.'); return; }
  if (!(c.transcript || c.notes)) { if (!silent) toast('Add notes or a transcript to this call so SDR AI has something to review.'); return; }
  const l = byId('leads', c.leadId), a = state.agents.find(x => x.name === c.agentName);
  if (!silent) toast('✦ SDR AI is reviewing the call…');
  try {
    const r = await window.aiBrain.analyzeCall({ lead: leadForAI(l), agent: agentForAI(a, c.agentName), call: { type: c.type, outcome: c.outcome, notes: c.notes || '', transcript: c.transcript || '' } });
    c.ai = Object.assign({}, r, { at: Date.now() });
    if (l) {
      (r.memories || []).forEach(m => { if (m && m.text && !M(l).some(x => x.text.toLowerCase() === String(m.text).toLowerCase())) M(l).push({ id: uid(), cat: m.cat || 'Fact', text: String(m.text).slice(0, 160), src: 'SDR AI · ' + (c.agentName || 'call'), at: Date.now() }); });
      if (r.callbackScript && l.status !== 'Do not call' && c.outcome !== 'Asked not to be called') l.nextScript = { text: r.callbackScript, at: Date.now(), from: callId, agent: c.agentName || '' };
    }
    save();
    if (silent) { if (page === 'Call records' || page === 'SDR AI') render(); toast('✦ SDR AI reviewed the call' + (l ? ' with ' + (l.name || 'this lead') : '') + '. See Call records.'); }
    else { render(); aiShowReview(callId); }
  } catch (e) { console.error(e); toast('AI review didn’t work: ' + String(e.message || e).slice(0, 140)); }
}
function aiList(arr, f) { return (arr || []).length ? '<ul style="margin:6px 0 0;padding-left:18px">' + arr.map(x => '<li style="margin:4px 0">' + f(x) + '</li>').join('') + '</ul>' : '<p class="muted" style="margin:4px 0">—</p>'; }
function aiShowReview(callId) {
  const c = byId('calls', callId), r = c && c.ai; if (!r) return;

  <p><span class="chip ${sent === 'positive' ? 'ok' : sent === 'negative' ? 'bad' : ''}">${esc(sent)}</span> ${r.score !== undefined ? `<span class="chip">Call score ${esc(r.score)}/10</span>` : ''}</p>
  <div class="note">${esc(r.summary || '')}</div>
  <label>🎯 Next step</label><div class="script" style="max-height:none">${esc((ns.action || '').toUpperCase())}${ns.inDays !== undefined ? ' in ' + esc(ns.inDays) + ' day(s)' : ''}${ns.reason ? ' · ' + esc(ns.reason) : ''}</div>
  ${r.callbackScript ? `<label>📞 Call-back script</label><div class="script" style="max-height:none">${esc(r.callbackScript)}</div><div class="actions" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn secondary small" onclick="speak(byId('calls','${c.id}').ai.callbackScript, state.agents.find(a=>a.name===byId('calls','${c.id}').agentName))">▶ Hear it</button><button type="button" class="btn outline small" onclick="stopSpeech()">⏹ Stop</button></div>` : ''}
  <label>✅ What worked</label>${aiList(r.coaching && r.coaching.worked, x => esc(x))}
  <label>⚠️ What hurt the call, and a better line</label>${aiList(r.coaching && r.coaching.hurt, x => `<b>“${esc(x.line)}”</b><br><small class="muted">${esc(x.why)}</small><br>Better: <i>“${esc(x.better)}”</i>`)}

}
function aiApplyNext(callId) {

}
async function aiCoachAgent(agentId) {

    <div class="actions" style="justify-content:flex-start"><button type="button" class="btn secondary small" onclick="speak(fill($('f_cOpen').value,{name:'Doctor Smith',business:'Smith Family Practice'},byId('agents','${a.id}')),byId('agents','${a.id}'))">▶ Hear new opening</button><button type="button" class="btn outline small" onclick="stopSpeech()">⏹ Stop</button></div>
    <div class="actions"><button type="button" class="btn outline" onclick="closeModal()">Keep my current script</button><button type="submit" class="btn">✔ Use this script</button></div>`;
    $('form').onsubmit = e => { e.preventDefault(); a.prev = a.prev || []; a.prev.unshift({ opening: a.opening, script: a.script, at: Date.now() }); a.prev = a.prev.slice(0, 5); a.opening = $('f_cOpen').value; a.script = $('f_cScript').value; save(); closeModal(); render(); toast(a.name + '’s script updated. You can undo it on the Agents page.'); };
    if (!$('modal').open) $('modal').showModal();
  } catch (e) { console.error(e); toast('Script coach didn’t work: ' + String(e.message || e).slice(0, 140)); }
}
function undoScript(agentId) { const a = byId('agents', agentId); const p = a && a.prev && a.prev.shift(); if (!p) return; a.opening = p.opening; a.script = p.script; save(); render(); toast(a.name + '’s previous script is back.'); }


/* ---------- listen to my call (speech-to-text in this browser) ---------- */
let rec = null, listening = false;
function listenStop() { listening = false; if (rec) { try { rec.stop(); } catch (e) {} rec = null; } const b = $('listenBtn'); if (b) { b.textContent = '🎤 Listen to my call'; b.classList.add('green'); } const st = $('listenState'); if (st) st.textContent = ''; }
function listenToggle() {
  if (listening) { listenStop(); toast('Stopped listening. Pick the outcome and Save, and SDR AI will review the call.'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Listening works in Google Chrome or Microsoft Edge. You can still type or paste notes.'); return; }
  const box = $('f_transcript'); let base = box.value ? box.value.replace(/\s*$/, '\n') : '';
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = ($('listenLang') || {}).value || 'en-US';
  rec.onresult = e => { let fin = '', tmp = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t.trim() + '\n'; else tmp += t; } if (fin) base += fin; box.value = base + (tmp ? '… ' + tmp : ''); box.scrollTop = box.scrollHeight; };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { toast('Please allow the microphone for Voice Studio, then try again.'); listenStop(); } };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (e) {} } };
  try { rec.start(); listening = true; } catch (e) { toast('Couldn’t start listening: ' + e.message); return; }
  const b = $('listenBtn'); b.textContent = '⏹ Stop listening'; b.classList.remove('green'); $('listenState').textContent = '● Listening…';

/* ---------- import from Lead Prospector (link: #import=...) ---------- */
const STATE_CODES = { alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY','puerto rico':'PR' };
function toStateCode(v) { v = String(v || '').trim(); if (/^[A-Za-z]{2}$/.test(v)) return v.toUpperCase(); return STATE_CODES[v.toLowerCase()] || ''; }
function checkImport() {
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)/); if (!m) return;
  let data;
  try { let b = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '='; data = JSON.parse(decodeURIComponent(escape(atob(b)))); }
  catch (e) { history.replaceState(null, '', location.pathname); toast('That import link is incomplete. Try pushing again from Lead Prospector.'); return; }
  history.replaceState(null, '', location.pathname);
  const list = (data && Array.isArray(data.leads) ? data.leads : []).slice(0, 300);
  const have = new Set(state.leads.map(l => digits(l.phone).slice(-10)).filter(Boolean));
  const fresh = [], dupes = [];
  list.forEach(x => { const d = digits(x.phone).slice(-10); if (!d) return; if (have.has(d)) dupes.push(x); else { have.add(d); fresh.push(x); } });
  if (!fresh.length) { toast(dupes.length ? `All ${dupes.length} lead${dupes.length > 1 ? 's are' : ' is'} already in Voice Studio.` : 'No leads with phone numbers in that link.'); return; }
  openForm(`Import ${fresh.length} lead${fresh.length > 1 ? 's' : ''} from ${esc(data.src || 'Lead Prospector')}`,
    `<p style="margin-top:0">${dupes.length ? `${dupes.length} already in Voice Studio will be skipped. ` : ''}Website scan findings come along, so SDR AI can mention real issues.</p>
    <div class="script" style="max-height:200px">${fresh.slice(0, 12).map(x => `<div>• <b>${esc(x.business || x.name)}</b>${x.state ? ' · ' + esc(toStateCode(x.state) || x.state) : ''}${x.findings && x.findings.length ? ' · <span class="muted">' + esc(x.findings[0]) + '</span>' : ''}</div>`).join('')}${fresh.length > 12 ? `<div class="muted">+ ${fresh.length - 12} more</div>` : ''}</div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" name="landline" value="1" style="width:auto;margin-top:3px"> <span>These are <b>business office lines</b> from business listings (needed for AI-voice calls). Leave unchecked if you're not sure; you can set it per lead.</span></label>
    <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" name="plan" value="1" checked style="width:auto;margin-top:3px"> <span>Start the SDR AI follow-up plan for them today</span></label>`,
    v => {
      const now = Date.now();
      fresh.forEach(x => {
        const l = { id: uid(), created: now, name: x.name || '', business: x.business || '', phone: x.phone, email: x.email || '', state: toStateCode(x.state),
          lineType: v.landline ? 'Business landline' : 'Unknown', consent: 'None', status: 'New',
          notes: [x.city ? 'City: ' + x.city : '', x.type ? 'Type: ' + x.type : '', x.notes || ''].filter(Boolean).join('\n'), src: 'Lead Prospector', lpId: x.lpId };
        l.r = { industry: x.industry || '', website: x.website || '', hasSite: x.noSite ? 'No' : (x.website ? 'Yes' : 'Unknown'),
          siteQuality: x.outdated ? 'Outdated' : 'Unknown', ada: x.ada ? 'Missing or broken' : 'Unknown', cookie: x.cookie ? 'Missing or broken' : 'Unknown',
          missesCalls: x.missesCalls ? 'Yes' : 'Unknown', advertising: x.ppc || (x.ads && x.ads.length) ? 'Yes' : 'Unknown', rating: x.rating || '', reviews: x.reviews || '' };
        l.mem = (x.findings || []).map(f => ({ id: uid(), cat: 'Fact', text: 'Website scan: ' + f, src: 'Lead Prospector scan', at: now }));
        if (x.ads && x.ads.length) l.mem.push({ id: uid(), cat: 'Fact', text: 'Runs paid ads: ' + x.ads.join(', ') + (x.ppc ? ' (PPC)' : ''), src: 'Lead Prospector scan', at: now });
        if (v.plan) l.seq = { start: todayISO(), done: {} };
        state.leads.push(l);
      });
      toast(`🎙 ${fresh.length} lead${fresh.length > 1 ? 's' : ''} imported from Lead Prospector${dupes.length ? ` (${dupes.length} duplicate${dupes.length > 1 ? 's' : ''} skipped)` : ''}.`);
      page = v.plan ? 'SDR AI' : 'Leads'; if (state.sdr) { state.sdr.lead = ''; state.sdr.tab = 'Today'; }
    });
}
$('modal').addEventListener('close', () => { stopSpeech(); listenStop(); });
window.addEventListener('pagehide', stopSpeech);

<script>

const VOICE_API = 'https://webswan-billing.netlify.app/.netlify/functions/voice-calls';

async function voiceApi(body) {

const OPT_OUT = /(do not call|don'?t call|stop calling|remove (me|us|this number)|take (me|us) off|not interested,? (thank|bye)|put (me|us) on (your|the) do not call)/i;

async function liveCall(leadId) {

async function liveStart(l, a) {

function liveApply(x, c) {
  const before = JSON.stringify(x.live);
  x.live = Object.assign(x.live || {}, { status: c.status, endReason: c.endReason, start: c.start, end: c.end });
  if (c.start && c.end) x.live.seconds = Math.max(0, Math.round((new Date(c.end) - new Date(c.start)) / 1000));
  const done = c.status === 'completed' || c.status === 'failed';
  if (!done) { x.outcome = c.status === 'started' ? 'In progress…' : 'Calling…'; return before !== JSON.stringify(x.live); }
  if (x.live.final) return before !== JSON.stringify(x.live);
  x.live.final = true;
  const lines = (c.transcript || []).filter(m => m.text);
  x.transcript = lines.map(m => (m.role === 'user' ? 'Prospect' : (x.agentName || 'Agent')) + ': ' + m.text).join('\n');
  x.notes = [c.summary, x.live.seconds ? 'Length ' + Math.floor(x.live.seconds / 60) + 'm ' + (x.live.seconds % 60) + 's' : '', c.endReason ? 'Ended: ' + c.endReason.replace(/_/g, ' ') : ''].filter(Boolean).join(' · ');
  const said = lines.filter(m => m.role === 'user').map(m => m.text).join(' ');
  const l = byId('leads', x.leadId);
  if (/^dial_(no_answer|busy|timeout)$|voicemail/.test(c.endReason || '') || (c.status === 'failed' && !said)) x.outcome = 'No answer';

}
async function livePoll() {

  if (!pend.length || !window.cloudUser) return;
  let changed = false;
  for (const x of pend) { try { const d = await voiceApi({ action: 'get', callId: x.live.callId }); if (d.call && liveApply(x, d.call)) changed = true; } catch (e) {} }

async function liveSync(quiet) {

    const since = Date.now() - 14 * 864e5; let added = 0, updated = 0;
    for (const name of ags) {

          x = { id: uid(), at: c.start ? new Date(c.start).getTime() : Date.now(), leadId: l ? l.id : '', leadName: l ? l.name : (m.lead || c.to), business: l ? l.business : (m.business || ''), agentName: name[0].toUpperCase() + name.slice(1), type: 'Live AI call', outcome: 'Calling…', notes: '', live: { callId: c.id, to: c.to } };

  } catch (e) { if (!quiet) toast('Couldn’t pull live results: ' + e.message); }
}

/* ---------- auto-dialer (Netlify dials the queue every minute inside the schedule) ---------- */

    <div class="formgrid"><div><label>Days</label><div class="toolbar">${DIAL_DAYS.map(([v, l]) => `<label style="display:inline-flex;gap:4px;align-items:center;font-weight:400"><input type="checkbox" class="dialDay" value="${v}" ${(s.days || []).includes(v) ? 'checked' : ''}> ${l}</label>`).join('')}</div></div>

    <p><span class="chip">${k.queued || 0} waiting</span> <span class="chip ok">${k.called || 0} dialed</span> <span class="chip warn">${k.skipped || 0} skipped</span> ${k.error ? `<span class="chip bad">${k.error} errors</span>` : ''} ${dialQ.lastRun ? `<small class="muted">Last check ${esc(fmtDate(dialQ.lastRun))}</small>` : ''}</p>
    ${recent.length ? `<details><summary>Latest activity</summary>${recent.map(l => `<div class="listitem row"><small><b>${esc(l.name || '')}</b> · ${esc(l.business || '')}</small><small class="muted">${esc(l.status)}${l.note ? ' · ' + esc(l.note) : ''}${l.calledAt ? ' · ' + esc(fmtDate(l.calledAt)) : ''}</small></div>`).join('')}</details>` : ''}

}
async function dialSave() {
