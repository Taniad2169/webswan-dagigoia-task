<style>
  :root { --blue: #1182f0; --soft: #6ca1d4; --ink: #1d2733; --muted: #6b7684; --line: #e6ebf2; --bg: #f6f8fb; --side: #fff; --me: #e9f3fe; --red: #d32f2f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.55 "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--bg); }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .brand b { font-size: 17px; } .brand small { color: var(--muted); display: block; }
  .brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .list { overflow-y: auto; flex: 1; padding: 8px; }
  .agent { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font: inherit; color: inherit; }
  .agent:hover, .agent.on { background: #eef4fb; }
  .agent img { width: 58px; height: 58px; border-radius: 12px; object-fit: cover; }
  .agent .role { font-weight: 800; font-size: 17px; letter-spacing: .2px; }
  .agent .prev { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .agent .when { color: var(--muted); font-size: 12px; align-self: start; padding-top: 4px; }
  .foot { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .foot a { color: var(--blue); }
  main { display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .top .who b { font-size: 17px; display: block; } .top .who small { color: var(--muted); }
  .top .sp { flex: 1; }
  select, input, textarea, button { font: inherit; }
  .top select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 600; color: var(--ink); }
  .btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px; background: #fbfcfe; border-bottom: 1px solid var(--line); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px 22px 30px; }
  .day { margin: 26px 0 10px; font-size: 22px; font-weight: 800; color: var(--red); border-bottom: 2px solid #f3c7c7; padding-bottom: 4px; }
  .day { cursor: pointer; user-select: none; } .day small { font-size: 13px; font-weight: 600; opacity: .7; }
  .find { position: sticky; top: 0; z-index: 2; background: inherit; padding: 4px 0 8px; } .find input { width: 100%; padding: 9px 12px; border: 1px solid #cfe3fb; border-radius: 10px; font: inherit; }
  .day.today { color: var(--blue); border-color: #cfe3fb; }
  .m { max-width: 900px; margin: 10px 0; }
  .m .meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .m .body { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; overflow-wrap: anywhere; }
  .m.me { margin-left: auto; max-width: 720px; } .m.me .body { background: var(--me); border-color: #d6e7fb; }
  .m .body h1 { font-size: 22px; margin: 4px 0 8px; } .m .body h2 { font-size: 19px; margin: 14px 0 6px; } .m .body h3 { font-size: 16.5px; margin: 12px 0 4px; }
  .m .body p { margin: 6px 0; } .m .body ul { margin: 6px 0 6px 20px; padding: 0; }
  .m .body a { color: #0b5cad; }
  .m .copy { font-size: 12px; color: var(--blue); background: none; border: 0; cursor: pointer; padding: 2px 0; }
  .compose { display: flex; gap: 10px; padding: 12px 18px; background: #fff; border-top: 1px solid var(--line); }
  .compose textarea { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: none; height: 54px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 18px 0; }
  .panel.tall { max-height: 62vh; overflow: auto; }
  .pi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .pi textarea { font: inherit; font-size: 14px; }
  .chip { display: inline-block; font-size: 12px; border-radius: 99px; padding: 2px 8px; background: #eef5fc; color: #0b4f8a; margin-right: 4px; }
  .chip.ok { background: #e6f6ec; color: #17693a; } .chip.bad { background: #fde8e8; color: #9b1c1c; }
  .panel label { display: block; font-size: 13px; color: var(--muted); margin: 6px 0 2px; }
  .panel input, .panel textarea, .panel select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .gate { max-width: 420px; margin: 18vh auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; }
  .hint { color: var(--muted); font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0b2f57; color: #fff; padding: 10px 16px; border-radius: 10px; display: none; z-index: 9; }
  .back { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .app.chat aside { display: none; } .app:not(.chat) main { display: none; }
    .back { display: inline-block; }
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  const OWNERS = ["thewebswann@gmail.com", "taniadomingue373@gmail.com"];
  const app = initializeApp({ apiKey: "AIzaSyBxuPZnF8rSZPkmoeqNR_9PQtFUJNKU3JM", authDomain: "webswan-gigoia-task.firebaseapp.com", projectId: "webswan-gigoia-task", appId: "1:970866236717:web:63ddb5c2557d083b8bc7a4" });
  const auth = getAuth(app);
  window._auth = { signIn: () => signInWithPopup(auth, new GoogleAuthProvider()), signOut: () => signOut(auth), token: async () => auth.currentUser ? auth.currentUser.getIdToken() : null };

</script>
<script>
const API = "https://webswan-billing.netlify.app/.netlify/functions/team";
const PROSPECTOR = "https://webswan-lead-prospector.netlify.app";
const ORDER = ["eva", "tatiana", "linda", "rachel"];
const FALLBACK = { eva: { name: "Eva", role: "Executive Assistant", photo: "img/eva.jpg" }, tatiana: { name: "Tatiana Lambert", role: "Content Creator", photo: "img/tatiana.jpg" }, linda: { name: "Linda", role: "Legal & Compliance", photo: "img/linda.jpg" }, rachel: { name: "Rachel Bennett", role: "Receptionist (inbound calls)", photo: "img/rachel.jpg" } };
let S = { agents: FALLBACK, last: {}, providers: { deepseek: "DeepSeek", chatgpt: "ChatGPT (Gips)", gemini: "Gemini (Jimmy)", claude: "Claude" }, ready: {}, settings: { provider: "deepseek", competitors: [] } };
let cur = "eva", msgs = [], pendingDraft = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const toast = (t) => { const e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 3800); };
async function api(body) {
  const tok = await window._auth.token();
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
// Markdown → safe HTML (marked + DOMPurify from cdnjs; a small built-in fallback if they can't load).
function miniMd(t) {
  const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2">$2</a>');
  let h = "", list = false;
  for (const line of String(t || "").split("\n")) {
    const m = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { if (!list) { h += "<ul>"; list = true; } h += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (list) { h += "</ul>"; list = false; }
    if (m) h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; else if (line.trim()) h += "<p>" + inline(line) + "</p>";
  }
  return h + (list ? "</ul>" : "");
}
const md = (t) => (window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(String(t || ""))) : miniMd(t)).replace(/<a /g, '<a target="_blank" rel="noopener" ');
const dayKey = (iso) => new Date(iso).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const timeOf = (iso) => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
function when(iso) { if (!iso) return ""; const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? timeOf(iso) : d.toLocaleDateString("en-US", { day: "2-digit", month: "short" }); }

function drawList() {
  $("list").innerHTML = ORDER.map((k) => { const a = (S.agents || FALLBACK)[k] || FALLBACK[k], l = S.last[k];
    return `<button class="agent ${k === cur ? "on" : ""}" data-a="${k}"><img src="${esc(a.photo)}" alt=""><div><div class="role">${esc(a.role)}</div><div class="prev">${esc(a.name)}: ${esc(l ? l.text.replace(/[#*]/g, "") : "Ready when you are")}</div></div><div class="when">${esc(l ? when(l.at) : "")}</div></button>`; }).join("");
  document.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => openAgent(b.dataset.a));
}
function drawProviders() {
  $("prov").innerHTML = Object.entries(S.providers).map(([k, v]) => `<option value="${k}" ${k === ((S.settings.brains || {})[cur] || S.settings.provider) ? "selected" : ""} ${S.ready[k] === false ? "disabled" : ""}>${esc(v)}${S.ready[k] === false ? " (not connected)" : ""}</option>`).join("");
}
let openDays = {}, findQ = "";
function drawMsgs() {
  const today = dayKey(new Date().toISOString()), q = findQ.toLowerCase();
  const list = q ? msgs.filter((m) => String(m.text || "").toLowerCase().includes(q)) : msgs;
  const days = []; for (const m of list) { const d = dayKey(m.at); if (!days.length || days[days.length - 1].d !== d) days.push({ d, ms: [] }); days[days.length - 1].ms.push(m); }
  const lastDay = days.length ? days[days.length - 1].d : "";
  let h = `<div class="find"><input id="findBox" type="search" placeholder="🔍 Search ${esc(((S.agents || FALLBACK)[cur] || FALLBACK[cur]).name)}'s history…" value="${esc(findQ)}"></div>`;
  for (const g of days) {
    const ok = cur + g.d, open = q || (ok in openDays ? openDays[ok] : (g.d === today || g.d === lastDay));
    h += `<div class="day ${g.d === today ? "today" : ""}" data-day="${esc(g.d)}" title="Click to open or close">${open ? "▾" : "▸"} ${esc(g.d)} <small>(${g.ms.length})</small></div>`;
    if (!open) continue;
    for (const m of g.ms) h += `<div class="m ${m.role === "user" ? "me" : ""}"><div class="meta">${m.role === "user" ? "You" : esc(((S.agents || FALLBACK)[cur] || FALLBACK[cur]).name)} · ${esc(timeOf(m.at))}${m.provider ? " · " + esc(S.providers[m.provider] || m.provider) : ""}</div><div class="body">${m.role === "user" ? esc(m.text).replace(/\n/g, "<br>") : md(m.text)}</div>${m.role !== "user" ? `<button class="copy" data-copy="${esc(m.id)}">Copy</button>` : ""}</div>`;
  }
  if (!days.length) h += q ? `<p class="hint">Nothing matches "${esc(findQ)}".</p>` : `<p class="hint">No messages yet. Say hi to ${esc(((S.agents || FALLBACK)[cur] || FALLBACK[cur]).name)}.</p>`;
  $("msgs").innerHTML = h;
  const fb = $("findBox"); fb.oninput = () => { findQ = fb.value; clearTimeout(fb._t); fb._t = setTimeout(() => { drawMsgs(); const n = $("findBox"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $("msgs").querySelectorAll("[data-day]").forEach((d) => d.onclick = () => { if (findQ) return; openDays[cur + d.dataset.day] = !d.textContent.startsWith("▾"); drawMsgs(); });
  $("msgs").querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => { const m = msgs.find((x) => x.id === b.dataset.copy); if (m) navigator.clipboard.writeText(m.text).then(() => toast("Copied")); });
  if (!q) $("msgs").scrollTop = $("msgs").scrollHeight;
}
const TOOLS = {
  eva: [["☀️ Morning briefing now", () => run("eva_daily")], ["📊 Monday briefing now", () => run("eva_monday")], ["✉️ New email draft", () => draftPanel()], ["⚙️ Settings", () => settingsPanel()]],
  tatiana: [["📅 Month plan", () => planPanel()], ["🎬 Schedule a video", () => videoPanel()], ["🔗 Content360 accounts", () => c360Panel()], ["📱 Quick posts for this week", () => run("tatiana_weekly")]],
  linda: [["🔎 Review a website", () => lindaPanel()]],
  rachel: [["📞 Rachel's script", () => ask("Show me Rachel's current receptionist script and suggest improvements.")]]
};
async function openAgent(k) {
  cur = k; findQ = ""; drawProviders(); const a = (S.agents || FALLBACK)[k] || FALLBACK[k];
  $("tImg").src = a.photo; $("tName").textContent = a.name; $("tRole").textContent = a.role;
  $("tools").innerHTML = (TOOLS[k] || []).map((t, i) => `<button class="btn" data-t="${i}">${esc(t[0])}</button>`).join("");
  $("tools").querySelectorAll("[data-t]").forEach((b) => b.onclick = TOOLS[k][b.dataset.t][1]);
  $("extra").innerHTML = ""; $("txt").placeholder = { eva: "Ask Eva: check my email, draft a reply, what's on my calendar…", tatiana: "Ask Tatiana for a post, a reel script, a blog…", linda: "Paste a website or ask about a law, disclaimer or script wording…", rachel: "Tell me how Rachel should answer…" }[k];
  document.querySelector(".app").classList.add("chat"); drawList();
  $("msgs").innerHTML = '<p class="hint">Loading…</p>';
  try { msgs = (await api({ action: "history", agent: k })).messages || []; } catch (e) { msgs = []; toast(e.message); }
  drawMsgs(); if (k === "eva" && pendingDraft) draftPanel(pendingDraft);
}
function showList() { document.querySelector(".app").classList.remove("chat"); }
async function ask(text) {
  $("send").disabled = true; msgs.push({ id: "tmp", role: "user", text, at: new Date().toISOString() }); msgs.push({ id: "tmp2", role: "agent", text: "_Thinking…_", at: new Date().toISOString() }); drawMsgs();
  try { const r = await api({ action: "chat", agent: cur, text, provider: $("prov").value }); msgs = msgs.filter((m) => !m.id.startsWith("tmp")).concat(r.messages); S.last[cur] = { at: r.messages[1].at, text: r.messages[1].text.slice(0, 140) }; }
  catch (e) { msgs = msgs.filter((m) => m.id !== "tmp2"); toast(e.message); }
  $("send").disabled = false; drawMsgs(); drawList();
}
async function run(job) { try { await api({ action: "run", job }); toast("Started. It shows up here in a minute or two; refresh this chat then."); setTimeout(() => openAgent(cur), 90000); } catch (e) { toast(e.message); } }
function lindaPanel() {
  $("extra").innerHTML = `<div class="panel"><div class="row"><div><label>Website</label><input id="lUrl" placeholder="example.com"></div><div><label>Business type</label><input id="lInd" placeholder="mortgage, real estate, doctor, MCA…"></div><div><label>State</label><input id="lSt" placeholder="FL"></div></div><p style="margin:10px 0 0"><button class="btn pri" id="lGo">Review it</button> <span class="hint">Linda reads the site and its privacy, disclaimer and terms pages, then writes a report with sources.</span></p></div>`;

}

  $("extra").innerHTML = `<div class="panel"><label>Your 3 competitors (for the Monday briefing)</label><div class="row">${[0, 1, 2].map((i) => `<input id="c${i}" value="${esc(s.competitors[i] || "")}" placeholder="Name or website">`).join("")}</div>

function draftPanel(d) {
  d = d || {};
  $("extra").innerHTML = `<div class="panel"><b>✉️ Email draft for Gmail</b>${d.pdfBase64 ? ` <span class="hint">· 📎 ${esc(d.filename)} attached</span>` : ""}
  <div class="row"><div><label>To</label><input id="dTo" value="${esc(d.to || "")}" placeholder="office@practice.com"></div><div><label>Practice</label><input id="dPr" value="${esc(d.practice || "")}"></div><div><label>State</label><input id="dSt" value="${esc(d.state || "")}"></div></div>

let C3 = null, PLAN = null;
async function c360Load() { try { C3 = await api({ action: "c360_status" }); } catch (e) { C3 = { ready: false, error: e.message, accounts: [], map: {}, brands: ["The WebSwan", "WebSwan Digital Solutions", "WebSwan Media Network"] }; } return C3; }
const notReady = () => `<p class="hint">Content360 isn't connected yet. In Content360 open <b>Profile → Access tokens</b>, create one named "Voice Studio", and add it in Netlify (webswan-billing) as <b>CONTENT360_API_KEY</b>.${C3 && C3.error ? "<br>⚠️ " + esc(C3.error) : ""}</p>`;
async function c360Panel() {

// Tatiana's branded picture for a post: 1080x1080, WebSwan blues, the post's headline, brand name and website.
const BRAND_SITE = { "The WebSwan": "thewebswan.com", "WebSwan Digital Solutions": "webswandigitalsolutions.com", "WebSwan Media Network": "webswanmedianetwork.com" };
let LOGO = null;
function logoImg() { if (LOGO) return LOGO; LOGO = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "../rachel-bot/ws-logo.png"; }); return LOGO; }
async function cardCanvas(it) {
  const c = document.createElement("canvas"); c.width = c.height = 1080; const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 1080, 1080); g.addColorStop(0, "#1182f0"); g.addColorStop(1, "#339cde"); x.fillStyle = g; x.fillRect(0, 0, 1080, 1080);
  x.fillStyle = "rgba(147,229,250,.18)"; x.beginPath(); x.arc(980, 120, 260, 0, 7); x.fill(); x.beginPath(); x.arc(80, 1010, 200, 0, 7); x.fill();
  x.strokeStyle = "#6ca1d4"; x.lineWidth = 14; x.strokeRect(40, 40, 1000, 1000);
  x.fillStyle = "#fff"; x.font = "700 34px system-ui, Segoe UI, Arial"; x.fillText(String(it.brand).toUpperCase(), 100, 150);
  x.fillStyle = "#93e5fa"; x.fillRect(100, 175, 120, 8);
  const words = String(it.headline || it.text.split(/[.!?\n]/)[0]).replace(/[#*]/g, "").trim().split(/\s+/); let size = 92, lines;
  do { x.font = `800 ${size}px system-ui, Segoe UI, Arial`; lines = []; let line = ""; for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > 860 && line) { lines.push(line); line = w; } else line = t; } if (line) lines.push(line); size -= 6; } while (lines.length * size * 1.18 > 560 && size > 40);
  x.fillStyle = "#fff"; let y = 330; for (const l of lines) { x.fillText(l, 100, y); y += (size + 6) * 1.18; }
  const logo = await logoImg(); if (logo) { const h = 110, w = logo.width * h / logo.height; x.drawImage(logo, 100, 880, w, h); }
  x.font = "600 34px system-ui, Segoe UI, Arial"; x.fillStyle = "#fff"; x.textAlign = "right"; x.fillText(BRAND_SITE[it.brand] || "thewebswan.com", 980, 950);
  return c;
}
const toB64 = (c) => new Promise((res) => c.toBlob((b) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsDataURL(b); }, "image/png"));

async function planPanel(month) {

      ${it.title ? `<b>${esc(it.title)}</b>` : ""}<textarea class="pX" rows="${it.kind === "blog" ? 8 : 4}" ${it.status === "scheduled" ? "disabled" : ""}>${esc(it.text)}</textarea>
      <label style="display:inline-flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" class="pA" ${["approved", "scheduled"].includes(it.status) ? "checked" : ""} ${it.status === "scheduled" ? "disabled" : ""} style="width:auto"> Approve</label> <button class="btn pCopy" type="button">Copy</button>${it.note ? ` <small class="hint">${esc(it.note)}</small>` : ""}</div>`).join("")}` : `<p class="hint">No plan for this month yet. Tatiana writes 3 posts a week for each brand and 2 blog articles per brand; each blog also becomes a Google Business update, so your Google profiles get fresh content twice a month. It takes a few minutes.</p>`}</div>`;
  $("pMonth").onchange = () => planPanel($("pMonth").value);
  $("pMake").onclick = async () => { if (items.length && !confirm("Rewrite the whole month? Your edits on drafts will be replaced (scheduled posts stay in Content360).")) return; try { await api({ action: "plan_make", month: $("pMonth").value }); toast("Tatiana is writing the month. It shows up in her chat in a few minutes."); $("extra").innerHTML = ""; setTimeout(() => openAgent("tatiana"), 240000); } catch (e) { toast(e.message); } };
  if (!items.length) return;
  const changes = () => [...document.querySelectorAll(".pi")].map((d) => { const it = items.find((x) => x.id === d.dataset.id); const ap = d.querySelector(".pA").checked; const h = d.querySelector(".pH"); return { id: d.dataset.id, headline: h ? h.value : undefined, text: d.querySelector(".pX").value, date: d.querySelector(".pD").value, time: d.querySelector(".pT").value, status: it.status === "scheduled" ? undefined : ap ? "approved" : (it.status === "approved" ? "draft" : undefined) }; });
  document.querySelectorAll(".pi").forEach(async (d) => { const cv = d.querySelector(".pC"); if (!cv) return; const it = items.find((x) => x.id === d.dataset.id);
    const draw = async () => { const src = await cardCanvas(Object.assign({}, it, { headline: d.querySelector(".pH").value || it.headline })); cv.getContext("2d").drawImage(src, 0, 0); };
    if (it.image !== "own") { await draw(); d.querySelector(".pH").oninput = () => { clearTimeout(cv._t); cv._t = setTimeout(draw, 300); }; }

  });

  $("pAll").onclick = () => document.querySelectorAll(".pA:not(:disabled)").forEach((c) => c.checked = true);
