[build]
  publish = "."
  functions = "netlify/functions"
  # Nov 17: only rebuild on Netlify when something Netlify actually serves changed (functions, config, packages,
  # voice-studio, team). Edits to the GitHub Pages screens (index.html, studio, budget, ...) now skip the build and save credits.
  # (The old rule was inverted: it skipped only when voice-studio/team changed, so almost every edit cost a build.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify netlify.toml package.json package-lock.json voice-studio team"

[build.environment]
  # WORKPILOT_FIREBASE_KEY is a Firebase *web* key: it is public by design (it already sits in the WorkPilot and
  # Jennifer pages' Firebase setup). Firestore security rules protect the data, not this key, so the secret
  # scanner may skip it. Every other key stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "WORKPILOT_FIREBASE_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
