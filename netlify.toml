[build]
  publish = "."
  functions = "netlify/functions"
  # Skip Netlify builds (and credits) when only the GitHub Pages screens change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)voice-studio' ':(exclude)team'"

[build.environment]
  # WORKPILOT_FIREBASE_KEY is a Firebase *web* key: it is public by design (it already sits in the WorkPilot and
  # Jennifer pages' Firebase setup). Firestore security rules protect the data, not this key, so the secret
  # scanner may skip it. Every other key stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "WORKPILOT_FIREBASE_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
