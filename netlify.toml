[build]
  publish = "."
  functions = "netlify/functions"
  # Skip Netlify builds (and credits) when only the GitHub Pages screens change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)voice-studio' ':(exclude)team'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
